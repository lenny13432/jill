name = "jil-sweet16"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Die Website (public/) wird direkt ausgeliefert, /api/* geht an den Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "jil-sweet16"
# Nach "npx wrangler d1 create jil-sweet16" hier die angezeigte ID eintragen:
database_id = "HIER-DEINE-DATABASE-ID-EINTRAGEN"
migrations_dir = "migrations"
